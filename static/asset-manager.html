<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>素材库管理</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.28.1787881168"></script>
    <script src="/static/js/theme.js?v=2026.08.28.1787881168"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.28.1787881168">
    <link rel="stylesheet" href="/static/css/asset-manager.css?v=2026.08.28.1787881168">
</head>
<body>
    <div class="asset-page">
        <header class="asset-page-head">
            <div>
                <div class="asset-title">素材库管理</div>
                <div class="asset-sub">按库、分组、内容和预览管理素材与提示词。</div>
            </div>
            <div class="asset-head-actions">
                <div id="assetStatus" class="asset-status">准备就绪</div>
                <button id="storageSettingsBtn" class="asset-btn" type="button"><i data-lucide="settings"></i><span>偏好设置</span></button>
                <button id="refreshBtn" class="asset-btn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
            </div>
        </header>

        <!-- The resource category rail, unified search and resource-kind filter
             are rendered by WorkbenchResourceLibraryShell from the page's
             resource registry; this container is the single Resources chrome. -->
        <div id="resourceLibraryShell" class="resource-shell" role="presentation"></div>

        <!-- Canonical asset search: filter/search/paginate the project's assets
             through the canonical Asset query API, without the Canvas and
             without the per-category legacy tree. Rendered by the page from
             WorkbenchAssetQueryPanel, and only while an asset-kind resource
             category is active. -->
        <div id="assetQueryPanel" class="asset-query-host" role="region" aria-label="资产检索"></div>

        <!-- Canonical asset inspector: the selected asset's preview, metadata,
             version history, provenance and usage, read from the canonical
             Asset/AssetVersion store through the canonical version-history API.
             Rendered by the page from WorkbenchAssetInspector, and only while
             an asset from the canonical query is selected. -->
        <div id="assetInspector" class="asset-inspector-host" role="region" aria-label="资产详情"></div>
        <div id="artifactInspector" class="artifact-inspector-host" role="region" aria-label="产物详情"></div>

        <main id="assetManagerRoot" class="asset-manager-root"></main>
    </div>

    <input id="assetUploadInput" type="file" accept="image/*,video/*,audio/*,.json,.zip,application/json,application/zip" multiple hidden>
    <script src="/static/js/workbench/canvas/canvas-entry-compatibility.js?v=2026.09.05.1"></script>
    <script src="/static/js/workbench/canvas/resource-library-shell.js?v=2026.09.13.1"></script>
    <script src="/static/js/workbench/canvas/asset-query-panel.js?v=2026.09.13.2"></script>
    <script src="/static/js/workbench/canvas/asset-inspector.js?v=2026.09.13.2"></script>
    <script src="/static/js/workbench/canvas/artifact-inspector.js?v=2026.09.14.1"></script>
    <script src="/static/js/workbench/canvas/catalog-library.js?v=2026.09.14.1"></script>
    <script src="/static/js/asset-manager.js?v=2026.09.13.2"></script>
</body>
</html>
